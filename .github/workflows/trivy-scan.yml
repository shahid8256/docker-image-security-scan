name: Docker Image Security Scan

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Scan Docker Hub image with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: shahid8256/afrid-nginx:1.0
          format: table
          exit-code: '0'
          severity: HIGH,CRITICAL
