
name: Docker Image Scan

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Scan Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: docker.io/shahid8256/afrid-nginx:1.0
          severity: HIGH,CRITICAL
          exit-code: '0'
